<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de emissão de CO2 para diferentes meios de transporte">
    <title>Calculadora de Emissão de CO₂</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <h1 class="header__title">🌱 Calculadora de Emissão de CO2</h1>
            <p class="header__subtitle">Calcule a pegada de carbono da sua jornada e descubra o impacto ambiental do seu transporte</p>
        </div>
    </header>

    <main class="main">
        <form id="calculator-form" class="calculator-form">
            <div class="calculator-form__group">
                <label for="origin" class="calculator-form__label">Origem</label>
                <input 
                    type="text" 
                    id="origin" 
                    class="calculator-form__input" 
                    placeholder="Digite a cidade de origem"
                    list="cities-list"
                    required
                >
            </div>

            <div class="calculator-form__group">
                <label for="destination" class="calculator-form__label">Destino</label>
                <input 
                    type="text" 
                    id="destination" 
                    class="calculator-form__input" 
                    placeholder="Digite a cidade de destino"
                    list="cities-list"
                    required
                >
            </div>

            <datalist id="cities-list"></datalist>

            <div class="calculator-form__group">
                <label for="distance" class="calculator-form__label">Distância (km)</label>
                <input 
                    type="number" 
                    id="distance" 
                    class="calculator-form__input" 
                    placeholder="Distância em quilômetros"
                    readonly
                    min="0"
                    step="0.1"
                >
                <small class="calculator-form__helper-text">A distância será preenchida automaticamente.</small>
            </div>

            <div class="calculator-form__group">
                <label class="calculator-form__checkbox-label">
                    <input 
                        type="checkbox" 
                        id="manual-distance" 
                        class="calculator-form__checkbox"
                    >
                    <span>Inserir distância manualmente</span>
                </label>
            </div>

            <fieldset class="calculator-form__fieldset">
                <legend class="calculator-form__legend">Modo de Transporte</legend>
                <div class="calculator-form__transport-grid">
                    <label class="calculator-form__transport-option">
                        <input 
                            type="radio" 
                            name="transport" 
                            value="bicycle" 
                            class="calculator-form__radio"
                        >
                        <span class="calculator-form__transport-icon">🚴</span>
                        <span class="calculator-form__transport-text">Bicicleta</span>
                    </label>

                    <label class="calculator-form__transport-option">
                        <input 
                            type="radio" 
                            name="transport" 
                            value="car" 
                            class="calculator-form__radio"
                            checked
                        >
                        <span class="calculator-form__transport-icon">🚗</span>
                        <span class="calculator-form__transport-text">Carro</span>
                    </label>

                    <label class="calculator-form__transport-option">
                        <input 
                            type="radio" 
                            name="transport" 
                            value="bus" 
                            class="calculator-form__radio"
                        >
                        <span class="calculator-form__transport-icon">🚌</span>
                        <span class="calculator-form__transport-text">Ônibus</span>
                    </label>

                    <label class="calculator-form__transport-option">
                        <input 
                            type="radio" 
                            name="transport" 
                            value="truck" 
                            class="calculator-form__radio"
                        >
                        <span class="calculator-form__transport-icon">🚚</span>
                        <span class="calculator-form__transport-text">Caminhão</span>
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="calculator-form__submit">Calcular Emissão</button>
        </form>

        <section id="results" class="results hidden">
            <div id="results-content" class="results__content"></div>
        </section>

        <section id="comparison" class="comparison hidden">
            <div id="comparison-content" class="comparison__content"></div>
        </section>

        <section id="carbon-credits" class="carbon-credits hidden">
            <div id="carbon-credits-content" class="carbon-credits__content"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <p class="footer__text">Projeto desenvolvido como estudo no Bootcamp CI&T da DIO</p>
        </div>
    </footer>

    <script src="js/routes-data-fixed.js"></script>
    <script src="js/config.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
